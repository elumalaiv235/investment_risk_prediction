name: CI - Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI (Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client & Push SQLite for CI Testing
        working-directory: ./backend
        env:
          DATABASE_URL: 'file:./ci.db'
          JWT_SECRET: 'ci_jwt_secret_key_1234567890'
          SESSION_SECRET: 'ci_session_secret_key_1234567890'
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        env:
          DATABASE_URL: 'file:./ci.db'
          JWT_SECRET: 'ci_jwt_secret_key_1234567890'
          SESSION_SECRET: 'ci_session_secret_key_1234567890'
        run: npm test

      - name: Build Backend Distribution
        working-directory: ./backend
        run: npm run build

  frontend-ci:
    name: Frontend CI (Typecheck & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck & Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build
